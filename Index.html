<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZED FRAMES | Professional Videography & Video Editing Agency</title>
    <meta name="description" content="Professional video shoots and editing for stores, brands and businesses in Ghaziabad & nearby areas. Make your page stand out with ZED FRAMES.">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --bg-main: #0a0b10;
            --bg-card: rgba(18, 20, 29, 0.7);
            --bg-card-hover: rgba(28, 32, 45, 0.8);
            --bg-nav: rgba(10, 11, 16, 0.85);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-heading: #ffffff;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --gold: #f59e0b;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.8);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --bg-nav: rgba(248, 250, 252, 0.85);
            --text-main: #334155;
            --text-muted: #64748b;
            --text-heading: #0f172a;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --gold: #d97706;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(79, 70, 229, 0.3);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            position: relative;
        }

        h1, h2, h3, h4, .logo {
            font-family: var(--font-heading);
            color: var(--text-heading);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        /* FLOATING CORNER SOFTWARE ICONS */
        .software-icon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .software-icon {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            animation: float 6s ease-in-out infinite alternate;
            opacity: 0.75;
            transition: opacity 0.3s ease;
        }

        .software-icon:hover {
            opacity: 1;
        }

        /* Specific positions around corners/edges only */
        .icon-pr { top: 18%; left: 2%; background: linear-gradient(135deg, #00005b, #9999ff); color: #ea77ff; animation-delay: 0s; }
        .icon-ps { top: 65%; left: 2.5%; background: linear-gradient(135deg, #001e36, #31a8ff); color: #31a8ff; animation-delay: 1.5s; }
        .icon-canva { top: 22%; right: 2.5%; background: linear-gradient(135deg, #00c4cc, #7d2ae8); animation-delay: 3s; }
        .icon-capcut { top: 72%; right: 2%; background: #000000; border: 1px solid rgba(255,255,255,0.2); animation-delay: 4.5s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-18px) rotate(6deg); }
        }

        /* NAVBAR */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--bg-nav);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            transition: var(--transition);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-link {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-heading);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-heading);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-heading);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-heading);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* LAYOUT CONTAINERS */
        section {
            padding: 6rem 1.5rem;
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            z-index: 20;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 4rem auto;
        }

        .section-tag {
            display: inline-block;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* HERO SECTION */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 8rem;
            padding-bottom: 4rem;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .hero-badge i {
            color: var(--gold);
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .hero-title span {
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        [data-theme="light"] .hero-title span {
            background: linear-gradient(135deg, #0f172a 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* ABOUT SECTION */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }

        .about-features {
            list-style: none;
            margin: 2rem 0;
            display: grid;
            gap: 1rem;
        }

        .about-features li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .about-features i {
            color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(245, 158, 11, 0.1);
            color: var(--gold);
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* SERVICES */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .service-icon {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-md);
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .service-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .service-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* BEFORE / AFTER SECTION */
        .ba-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .ba-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            overflow: hidden;
        }

        .ba-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ba-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .badge-before { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-after { background: rgba(16, 185, 129, 0.2); color: #10b981; }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* PACKAGES */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            align-items: stretch;
        }

        .package-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: var(--transition);
        }

        .package-card.popular {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
            transform: scale(1.03);
        }

        .popular-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .package-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .package-price {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-heading);
            margin-bottom: 1.5rem;
        }

        .package-price span {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .package-features {
            list-style: none;
            margin-bottom: 2rem;
            flex-grow: 1;
            display: grid;
            gap: 0.8rem;
        }

        .package-features li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .package-features li i {
            color: var(--accent);
            font-size: 0.85rem;
        }

        /* HOW IT WORKS */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
        }
